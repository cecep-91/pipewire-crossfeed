name: Release

# Tag a commit `vX.Y.Z` and push it to cut a release:
#   git tag v2.0.0 && git push origin v2.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpipewire-0.3-dev libpulse-dev libasound2-dev python3-gi gir1.2-gtk-3.0 python3-pip binutils
          python3 -m pip install --user pyinstaller

      - name: Build and smoke-test binaries
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-binaries.sh "${GITHUB_REF_NAME#v}"

      - name: Assemble tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pipewire-crossfeed-$VERSION-linux-${{ matrix.arch }}"
          mkdir "$PKG"
          cp dist/crossfeed \
             crossfeed-ab.sh crossfeed_lib.py crossfeed-gui.py \
             install.sh Makefile README.md "$PKG/"
          [ -f dist/crossfeed-gui ] && cp dist/crossfeed-gui "$PKG/"
          tar czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
          body: |
            Release of standalone crossfeed audio engine.
            Works on any Linux distribution and any sound server (PipeWire, PulseAudio, ALSA).
            No drop-in configuration files required.
