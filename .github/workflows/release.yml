name: Release

# Tag a commit `vX.Y.Z` and push it to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# This builds self-contained x86_64 + aarch64 binary tarballs (glibc; musl
# users install from source, it's just Python) and publishes a GitHub
# release with them attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # ubuntu-22.04 = oldest supported runner glibc, for widest binary
          # compatibility across distros.
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-pip binutils
          python3 -m pip install --user pyinstaller

      - name: Build and smoke-test binaries
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-binaries.sh "${GITHUB_REF_NAME#v}"

      - name: Assemble tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="pipewire-crossfeed-$VERSION-linux-${{ matrix.arch }}"
          mkdir "$PKG"
          cp dist/crossfeed-gui dist/crossfeed-restore \
             crossfeed-ab.sh crossfeed.conf crossfeed-easyeffects.conf \
             install.sh README.md "$PKG/"
          tar czf "$PKG.tar.gz" "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: "*.tar.gz"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
          body: |
            Binary tarballs below are self-contained (Python + GTK bundled) and
            need only PipeWire itself on the host. They are built against glibc
            (Ubuntu 22.04); on musl systems (e.g. Void musl) install from
            source instead — see the README.

            To install: extract the tarball for your architecture and run
            `./install.sh` inside it.
