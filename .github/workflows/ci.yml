name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh scripts/package.sh

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpipewire-0.3-dev libpulse-dev libasound2-dev libgtk-3-dev libayatana-appindicator3-dev rpm dpkg-dev
      - name: Build crossfeed application
        run: make -j$(nproc)
      - name: Run DSP throughput benchmark
        run: make bench
      - name: Build Debian (.deb) and RPM (.rpm) packages
        run: |
          make deb
          make rpm
          ls -la dist/
      - name: Test installation script
        run: |
          ./install.sh
          ~/.local/bin/crossfeed --version
          ./install.sh --uninstall

  build-void:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package XBPS in Void Linux container
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/void-linux/void-glibc:latest sh -c "
            xbps-install -Suy -y base-devel pipewire-devel pulseaudio-devel alsa-lib-devel gtk+3-devel libayatana-appindicator-devel &&
            make clean &&
            make -j\$(nproc) &&
            make xbps
          "
          ls -la dist/
