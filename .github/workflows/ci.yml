name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install.sh crossfeed-ab.sh scripts/build-binaries.sh
      - name: python syntax check
        run: python3 -m py_compile crossfeed_lib.py crossfeed-gui.py

  build:
    # Same build as the release pipeline, so tagging never breaks by surprise.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 python3-pip binutils
          python3 -m pip install --user pyinstaller
      - name: Build and smoke-test binaries
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-binaries.sh
